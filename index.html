<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#962B42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comcast Issues">
<title>Comcast Issues</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --brand:#962B42; --brand-dark:#7a2236; --accent:#C05133;
  --bg:#ffffff; --card:#ffffff; --soft:#f6f2f3; --line:#e6dde0;
  --text:#231f20; --muted:#6b6265; --red:#c4151c; --green:#2e7d4f; --star:#e0a100;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;margin:0;flex:1;font-weight:700;letter-spacing:.2px}
.top .open{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:7px 12px;font-size:14px}
.tabs{display:flex;margin-top:10px}
.tab{flex:1;background:none;border:0;color:rgba(255,255,255,.75);padding:10px 4px 11px;font-weight:600;font-size:15px;border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:#fff;border-bottom-color:#fff}
.tab .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:rgba(255,255,255,.2);font-size:13px}
.bar{position:sticky;top:var(--hdr,96px);z-index:4;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:var(--soft)}
.chips{display:flex;gap:8px;margin-top:9px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
main{padding:12px 16px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.done{background:#fbfaf9}
.row1{display:flex;align-items:center;gap:8px}
.when{font-size:13px;color:var(--muted);flex:1}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.pill.open{background:#fdeee9;color:var(--accent)}
.pill.res{background:#e7f3ec;color:var(--green)}
.star{border:0;background:none;font-size:26px;line-height:1;padding:2px 2px 2px 8px;color:#c9bfc2}
.star[aria-pressed=true]{color:var(--star)}
.fixbtn{border:1px solid var(--line);background:#fff;color:var(--green);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700}
.done .fixbtn{color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;padding:9px 10px;font-size:14px}
.skipbtn{border:1px solid var(--line);background:#fff;color:#8a6100;border-radius:10px;font-weight:700}
.pill.skip{background:#fff4d6;color:#8a6100}
.skipnote{margin-top:8px;background:#fff8e6;border-radius:10px;padding:8px 10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.sheet textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}
.fixbar{background:#e7f3ec;border-radius:14px;padding:12px 14px;margin-bottom:12px;color:var(--green)}
.fixbar .btns{margin-top:10px}
.fixbar .btns button{padding:10px;font-size:15px}
.grp{font-size:15px;margin:18px 2px 8px;color:var(--brand);text-transform:none;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.grp:first-child{margin-top:4px}
.grp span{background:var(--soft);color:var(--muted);border-radius:999px;padding:1px 9px;font-size:13px}
.dayhd{font-weight:700;color:var(--green);padding-top:12px!important;border-bottom:2px solid var(--line)!important}
.list .when2{color:var(--muted);font-size:13px}
.tag2{font-size:12px;color:var(--green);margin-top:2px}
.asg .take{background:var(--brand);color:#fff}
.asg .take + button{margin-left:0}
.addr{font-weight:700;font-size:17px;margin-top:4px}
.who{color:var(--muted);font-size:15px}
.issue{margin-top:8px;white-space:pre-wrap;word-break:break-word}
.asg{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap}
.asg .lbl{font-size:13px;color:var(--muted)}
.asg .name{color:var(--red);font-weight:600;white-space:pre-wrap}
.asg .mine{color:var(--brand)}
.asg .none{background:#fff4d6;color:#8a6100;font-size:13px;font-weight:700;border-radius:8px;padding:2px 8px}
.asg .tag{font-size:12px;color:var(--muted)}
.asg button{margin-left:auto;border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:600}
.meta{margin-top:8px;font-size:14px;color:var(--muted);display:grid;gap:3px}
.meta b{color:var(--text);font-weight:600}
.call{display:inline-block;margin-top:9px;color:var(--brand);font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.welcome{text-align:center;padding:36px 8px}
.welcome h2{margin:0 0 6px;font-size:22px}
.welcome p{color:var(--muted);margin:6px auto 0;max-width:420px}
.big{display:block;width:100%;max-width:360px;margin:22px auto 0;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700}
.link{display:block;margin:14px auto 0;background:none;border:0;color:var(--brand);font-weight:600;text-decoration:underline}
.note{font-size:13px;color:var(--muted);margin-top:22px}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:16px}
.foot button{border:0;background:none;color:var(--brand);text-decoration:underline;font-size:13px}
.err{background:#fdecec;color:#8b1a1a;border-radius:12px;padding:12px;margin:12px 0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;transform:translateY(105%);transition:transform .2s ease}
.sheet-bg.on .sheet{transform:none}
.sheet h3{margin:0 0 2px;font-size:18px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.sheet input{width:100%;font-size:17px;border:1px solid var(--line);border-radius:12px;padding:12px}
.sheet .chips{flex-wrap:wrap;overflow:visible}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;border-radius:12px;padding:13px;font-weight:700;font-size:16px;border:1px solid var(--line);background:#fff}
.btns .go{background:var(--brand);border-color:var(--brand);color:#fff}
.btns .clr{color:var(--red)}
.list{max-height:55vh;overflow:auto}
.list div{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#231f20;color:#fff;border-radius:999px;padding:9px 16px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.hide{display:none!important}
</style>
</head>
<body>
<header id="hdr">
  <div class="top">
    <h1>Comcast Issues</h1>
    <button class="open" id="openBtn" type="button">Open sheet</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabMine" aria-selected="true" type="button">My Assigned<span class="n" id="nMine">0</span></button>
    <button class="tab" role="tab" id="tabAll" aria-selected="false" type="button">All Issues<span class="n" id="nAll">0</span></button>
  </div>
</header>
<div class="bar hide" id="bar">
  <input class="search" id="q" type="search" placeholder="Search address, name, issue, person" autocomplete="off">
  <div class="chips" id="chips">
    <button class="chip" data-f="open" aria-pressed="true" type="button">Open</button>
    <button class="chip" data-f="resolved" aria-pressed="false" type="button">Fixed</button>
    <button class="chip" data-f="skipped" aria-pressed="false" type="button">Skipped</button>
    <button class="chip" data-f="all" aria-pressed="false" type="button">All</button>
    <button class="chip" id="unOnly" aria-pressed="false" type="button">Unassigned only</button>
    <button class="chip" id="grpBtn" aria-pressed="true" type="button">By neighborhood</button>
    <button class="chip" id="sortBtn" aria-pressed="false" type="button">Newest first</button>
  </div>
</div>
<main id="main"></main>
<input type="file" id="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hide">

<div class="sheet-bg" id="asgBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="asgTitle">
    <h3 id="asgTitle">Assign</h3>
    <div class="sub" id="asgSub"></div>
    <input id="asgName" type="text" placeholder="Type a first name" autocomplete="off" autocapitalize="words">
    <div class="chips" id="asgChips"></div>
    <div class="btns">
      <button type="button" class="clr" id="asgClear">Remove</button>
      <button type="button" id="asgCancel">Cancel</button>
      <button type="button" class="go" id="asgSave">Save</button>
    </div>
  </div>
</div>
<div class="sheet-bg" id="skipBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="skipTitle">
    <h3 id="skipTitle">Skip this issue</h3>
    <div class="sub" id="skipSub"></div>
    <textarea id="skipNote" rows="4" placeholder="Note for the sheet, like: Not home, left a card"></textarea>
    <div class="btns">
      <button type="button" class="clr" id="skipUndo">Un-skip</button>
      <button type="button" id="skipCancel">Cancel</button>
      <button type="button" class="go" id="skipSave">Skip</button>
    </div>
  </div>
</div>
<div class="sheet-bg" id="chgBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="chgTitle">
    <h3 id="chgTitle">My changes</h3>
    <div class="sub">Saved on this phone only. Add them to the Excel sheet when you're done.</div>
    <div class="list" id="chgList"></div>
    <div class="btns"><button type="button" id="chgCopy">Copy all</button><button type="button" class="clr" id="chgClear">Clear fixed list</button></div>
    <div class="btns"><button type="button" class="go" id="chgClose">Done</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
var PREVIEW = false;

/* ---------- saved on this phone: favorites + my assignments, keyed by a hash of date + address ---------- */
var STORE = "comcastIssues.v1";
var saved = {fav:{}, asg:{}, names:[], me:"", fixed:{}, skip:{}};
try { var s = JSON.parse(localStorage.getItem(STORE) || "null"); if (s && typeof s === "object") { saved.fav = s.fav || {}; saved.asg = s.asg || {}; saved.names = s.names || []; saved.me = s.me || ""; saved.fixed = s.fixed || {}; saved.skip = s.skip || {}; } } catch (e) {}
var SHEET = "comcastIssues.sheet.v1";
function saveSheet(){
  try {
    localStorage.setItem(SHEET, JSON.stringify({name: fileInfo.name, at: fileInfo.at, issues: issues.map(function(it){ var o = Object.assign({}, it); o.date = it.date ? it.date.getTime() : null; return o; })}));
  } catch (e) { toast("Couldn't keep the sheet on this phone"); }
}
function restoreSheet(){
  try {
    var d = JSON.parse(localStorage.getItem(SHEET) || "null");
    if (!d || !Array.isArray(d.issues)) return false;
    issues = d.issues.map(function(it){ it.date = it.date != null ? new Date(it.date) : null; return it; });
    fileInfo = {name: d.name || "Saved sheet", at: d.at || ""};
    return true;
  } catch (e) { return false; }
}
function forgetSheet(){ try { localStorage.removeItem(SHEET); } catch (e) {} issues = []; fileInfo = null; render(); toast("Sheet removed from this phone"); }
function persist(){ try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) { toast("Couldn't save on this phone"); } }

function hash(str){ // FNV-1a, two 32-bit lanes; stored instead of the address itself
  var h1 = 0x811c9dc5, h2 = 0x01000193 ^ 0x5bd1e995;
  for (var i = 0; i < str.length; i++) { var c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); }
  return (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36);
}

/* ---------- tiny .xlsx reader (zip + XML), all on the phone ---------- */
function u16(b,o){return b[o]|(b[o+1]<<8)}
function u32(b,o){return (b[o]|(b[o+1]<<8)|(b[o+2]<<16)|(b[o+3]<<24))>>>0}
async function unzip(buf){
  var b = new Uint8Array(buf), eocd = -1;
  for (var i = b.length - 22; i >= Math.max(0, b.length - 66000); i--) if (u32(b,i) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("not-zip");
  var n = u16(b,eocd+10), p = u32(b,eocd+16), files = {};
  for (var k = 0; k < n; k++) {
    if (u32(b,p) !== 0x02014b50) throw new Error("not-zip");
    var meth = u16(b,p+10), csize = u32(b,p+20), nl = u16(b,p+28), xl = u16(b,p+30), cl = u16(b,p+32), lo = u32(b,p+42);
    var name = new TextDecoder().decode(b.subarray(p+46, p+46+nl));
    files[name] = {meth:meth, csize:csize, lo:lo};
    p += 46 + nl + xl + cl;
  }
  return {
    has: function(nm){ return !!files[nm]; },
    text: async function(nm){
      var f = files[nm]; if (!f) return null;
      var start = f.lo + 30 + u16(b,f.lo+26) + u16(b,f.lo+28), data = b.subarray(start, start + f.csize);
      if (f.meth === 0) return new TextDecoder().decode(data);
      if (f.meth !== 8) throw new Error("zip-method");
      if (typeof DecompressionStream === "undefined") throw new Error("old-browser");
      var ds = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return await new Response(ds).text();
    }
  };
}
function xml(t){ return new DOMParser().parseFromString(t, "application/xml"); }
function kids(el, name){ var out = []; if (!el) return out; for (var c = el.firstElementChild; c; c = c.nextElementSibling) if (c.localName === name) out.push(c); return out; }
function kid(el, name){ return kids(el, name)[0] || null; }
function allText(el){ var s = ""; if (!el) return s; var ts = el.getElementsByTagNameNS("*", "t"); for (var i = 0; i < ts.length; i++) { if (ts[i].parentNode.localName === "rPh") continue; s += ts[i].textContent; } return s; }

function isOn(el){ return !!el && !/^(0|false)$/.test(el.getAttribute("val") || ""); }
function isGreenColor(c){
  if (!c) return false;
  var rgb = c.getAttribute("rgb"); if (!rgb) return false; rgb = rgb.slice(-6);
  var r = parseInt(rgb.slice(0,2),16), g = parseInt(rgb.slice(2,4),16), b = parseInt(rgb.slice(4,6),16);
  return g >= 0x90 && g > r + 0x20 && g > b + 0x20;
}
function isRedColor(c){
  if (!c) return false;
  var rgb = c.getAttribute("rgb"), ix = c.getAttribute("indexed");
  if (rgb) { rgb = rgb.slice(-6); var r = parseInt(rgb.slice(0,2),16), g = parseInt(rgb.slice(2,4),16), bl = parseInt(rgb.slice(4,6),16); return r >= 0xB0 && g < 0x70 && bl < 0x70; }
  if (ix) return ix === "2" || ix === "10" || ix === "16" || ix === "53";
  return false;
}
// A rich-text cell becomes {text, red, rest}: red = the red line(s), rest = everything else
function runsStruck(si){ var rs = kids(si, "r"); return rs.length > 0 && rs.every(function(r){ var pr = kid(r, "rPr"); return !!pr && isOn(kid(pr, "strike")) || !allText(r).trim(); }); }
function richParts(si, cellRed){
  var runs = kids(si, "r");
  if (!runs.length) { var t = allText(si); return {text:t, red: cellRed ? t : "", rest: cellRed ? "" : t, rich:false}; }
  var red = "", rest = "";
  runs.forEach(function(r){ var t = allText(r), pr = kid(r, "rPr"), c = pr ? kid(pr, "color") : null; var isRed = c ? isRedColor(c) : cellRed; if (isRed) red += t; else rest += t; });
  return {text: red + rest, red: red, rest: rest, rich:true};
}

async function readWorkbook(buf){
  var z = await unzip(buf);
  var wb = xml(await z.text("xl/workbook.xml") || "");
  var d1904 = false, wp = wb.getElementsByTagNameNS("*", "workbookPr")[0];
  if (wp && /^(1|true)$/.test(wp.getAttribute("date1904") || "")) d1904 = true;
  var sheets = wb.getElementsByTagNameNS("*", "sheet"), target = "xl/worksheets/sheet1.xml";
  if (sheets.length) {
    var first = null;
    for (var i = 0; i < sheets.length; i++) if ((sheets[i].getAttribute("state") || "visible") === "visible") { first = sheets[i]; break; }
    first = first || sheets[0];
    var rid = first.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id") || first.getAttribute("r:id");
    var rels = xml(await z.text("xl/_rels/workbook.xml.rels") || "<x/>").getElementsByTagNameNS("*", "Relationship");
    for (var j = 0; j < rels.length; j++) if (rels[j].getAttribute("Id") === rid) {
      var tg = rels[j].getAttribute("Target"); target = tg.charAt(0) === "/" ? tg.slice(1) : "xl/" + tg.replace(/^\.\//, "");
    }
  }
  // styles: which cell styles have a red font
  var redXf = [], strikeXf = [], greenXf = [];
  var st = await z.text("xl/styles.xml");
  if (st) {
    var sd = xml(st), fontsEl = sd.getElementsByTagNameNS("*", "fonts")[0], fontRed = [];
    kids(fontsEl, "font").forEach(function(f){ fontRed.push(isRedColor(kid(f, "color"))); });
    var xfs = sd.getElementsByTagNameNS("*", "cellXfs")[0];
    var fontStrike = [], fillGreen = [];
    kids(fontsEl, "font").forEach(function(f){ fontStrike.push(isOn(kid(f, "strike"))); });
    kids(sd.getElementsByTagNameNS("*", "fills")[0], "fill").forEach(function(fl){ var pf = kid(fl, "patternFill"); fillGreen.push(!!pf && isGreenColor(kid(pf, "fgColor"))); });
    kids(xfs, "xf").forEach(function(x){ var fid = +(x.getAttribute("fontId") || 0); redXf.push(!!fontRed[fid]); strikeXf.push(!!fontStrike[fid]); greenXf.push(!!fillGreen[+(x.getAttribute("fillId") || 0)]); });
  }
  var sst = [];
  var ss = await z.text("xl/sharedStrings.xml");
  if (ss) kids(xml(ss).documentElement, "si").forEach(function(si){ sst.push(si); });
  var sx = await z.text(target);
  if (!sx) throw new Error("no-sheet");
  var sheet = xml(sx), rows = [];
  var rowEls = sheet.getElementsByTagNameNS("*", "row");
  for (var r = 0; r < rowEls.length; r++) {
    var re = rowEls[r];
    if (/^(1|true)$/.test(re.getAttribute("hidden") || "")) continue; // never show hidden rows
    var cells = [], cs = kids(re, "c"), col = 0;
    cs.forEach(function(c){
      var ref = c.getAttribute("r"); if (ref) col = colIndex(ref);
      var t = c.getAttribute("t") || "n", sIdx = +(c.getAttribute("s") || 0), cellRed = !!redXf[sIdx], v = kid(c, "v"), val;
      if (t === "s") { var si = sst[+(v ? v.textContent : -1)]; val = si ? richParts(si, cellRed) : {text:""}; }
      else if (t === "inlineStr") val = richParts(kid(c, "is"), cellRed);
      else if (t === "b") val = {text: v && v.textContent === "1" ? "TRUE" : "FALSE", bool: v && v.textContent === "1"};
      else if (t === "str" || t === "e") val = {text: v ? v.textContent : ""};
      else val = {text: v ? v.textContent : "", num: v && v.textContent !== "" ? +v.textContent : null, sIdx: sIdx};
      val.red = val.red || (cellRed && !val.rich ? val.text : val.red || "");
      val.strike = !!strikeXf[sIdx] || (t === "s" && sst[+(v ? v.textContent : -1)] ? runsStruck(sst[+v.textContent]) : false);
      val.green = !!greenXf[sIdx];
      cells[col] = val; col++;
    });
    rows.push({n: +(re.getAttribute("r") || r + 1), cells: cells});
  }
  return {rows: rows, d1904: d1904};
}
function colIndex(ref){ var m = /^[A-Z]+/.exec(ref), n = 0; if (!m) return 0; for (var i = 0; i < m[0].length; i++) n = n * 26 + (m[0].charCodeAt(i) - 64); return n - 1; }

/* ---------- turn sheet rows into issues ---------- */
var FIELDS = [
  ["date", function(h){ return /^date/.test(h) || /request came in/.test(h); }],
  ["address", function(h){ return /address/.test(h); }],
  ["name", function(h){ return /name/.test(h); }],
  ["phone", function(h){ return /phone/.test(h); }],
  ["issue", function(h){ return /issue/.test(h) && !/person|addressing/.test(h); }],
  ["person", function(h){ return /person|addressing/.test(h); }],
  ["resolved", function(h){ return /resolved|fixed|^done|complete|^status/.test(h) && !/note/.test(h); }],

  if (rows.length) h += '<div class="dayhd">Other changes</div>' + rows.map(function(r){ return "<div><b>" + esc(r.it.address || "No address") + '</b> <span class="when2">' + esc(r.it.dateText || "") + "</span><br>" + esc(r.text) + "</div>"; }).join("");
  $("chgList").innerHTML = h || "<div>Nothing yet. Issues you mark fixed show up here by day.</div>";
  $("chgClear").classList.toggle("hide", !fl.length); $("chgClear").textContent = "Clear fixed list"; delete $("chgClear").dataset.sure;
  $("chgBg").classList.add("on");
}
function clearFixed(){
  fixedList().forEach(function(it){ var v = fx(it.key); saved.fixed[it.key] = {on: true, at: v.at || Date.now(), cleared: true}; });
  persist(); render(); toast("Fixed list cleared. Those issues stay fixed");
}
$("chgClear").onclick = function(){
  var b = this; if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = "Tap again to clear"; return; }
  clearFixed(); openChanges();
};
$("chgCopy").onclick = function(){
  var t = fixedList().map(function(it){ var v = fx(it.key); return (it.address || "No address") + (it.dateText ? " (" + it.dateText + ")" : "") + ": Fixed" + (v.at ? " " + fmtDate(new Date(v.at)) : ""); })
    .concat(changeLines().map(function(r){ return (r.it.address || "No address") + (r.it.dateText ? " (" + r.it.dateText + ")" : "") + ": " + r.text; })).join("\n");
  var done = function(){ toast("Copied"); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function(){ toast("Couldn't copy on this phone"); });
  else toast("Couldn't copy on this phone");
};
$("chgClose").onclick = function(){ $("chgBg").classList.remove("on"); };
$("chgBg").addEventListener("click", function(e){ if (e.target === this) this.classList.remove("on"); });

  var b = e.target.closest(".chip"); if (!b) return;

  else if (b.id === "sortBtn") { newest = !newest; b.textContent = newest ? "Newest first" : "Oldest first"; }
  else { statusF = b.getAttribute("data-f"); document.querySelectorAll("[data-f]").forEach(function(x){ x.setAttribute("aria-pressed", x === b); }); }
  render();
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape") { closeAssign(); closeSkip(); $("chgBg").classList.remove("on"); } });
window.addEventListener("resize", setHdr);
var tt; function toast(t){ var el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(function(){ el.classList.remove("on"); }, 1800); }
